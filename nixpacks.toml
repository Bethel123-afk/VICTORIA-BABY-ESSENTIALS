[variables]
# Only VITE_ prefixed variables need to be available at build time
# so Vite can embed them into the React bundle.
# Sensitive keys (JWT_SECRET, FLUTTERWAVE keys, MONGO_URI) 
# are injected securely at runtime only, not baked into the image.
NODE_ENV = "production"
NIXPACKS_INSTALL_CMD = "npm ci --omit=dev"
